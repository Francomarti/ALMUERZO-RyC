<style id="app-css">/* Layout: una sola columna tipo lista de pedido; una tarjeta por día, barra de envío fija abajo. */
:root{
  --bg:#f3f6f2; --surface:#ffffff; --ink:#15211b; --muted:#5d6b63; --line:#d9e2db;
  --accent:#1c7a57; --accent-ink:#ffffff; --accent-soft:#dff1e8;
  --o1:#2c6db2; --o2:#d1731c; --warn:#a4451f;
  --f-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --f-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1712; --surface:#18231c; --ink:#e8f0ea; --muted:#9db0a3; --line:#2a3a30;
  --accent:#4cc79a; --accent-ink:#06150e; --accent-soft:#1d3a2c;
  --o1:#7db2ee; --o2:#f0a459; --warn:#f09a72; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1712; --surface:#18231c; --ink:#e8f0ea; --muted:#9db0a3; --line:#2a3a30;
  --accent:#4cc79a; --accent-ink:#06150e; --accent-soft:#1d3a2c;
  --o1:#7db2ee; --o2:#f0a459; --warn:#f09a72; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;margin:0;padding-inline:16px;padding-block:20px 120px}
.wrap{max-width:560px;margin-inline:auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-direction:column;gap:2px;padding-block:4px 6px}
.kicker{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--f-display);font-size:30px;line-height:1.1;margin:0;font-weight:800;text-wrap:balance}
.week{color:var(--muted);font-size:15px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.chip,.link{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer;min-height:40px}
.link{border-color:transparent;background:none;color:var(--muted);text-decoration:underline}
.chip:hover{border-color:var(--accent)}
button:focus-visible,summary:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.day.past{opacity:.72}
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.dayname{font-family:var(--f-display);font-size:20px;font-weight:700;margin:0}
.tag{font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:2px 9px}
.tag.mut{color:var(--muted);background:transparent;border:1px solid var(--line)}
.note{color:var(--warn);margin:0;font-weight:600}
.opt{display:grid;grid-template-columns:auto 1fr auto;align-items:start;gap:10px;text-align:left;width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;min-height:48px}
.opt:hover{border-color:var(--accent)}
.opt .dot{width:14px;height:14px;border-radius:50%;margin-top:4px}
.opt .dot.o1{background:var(--o1)} .opt .dot.o2{background:var(--o2)} .opt .dot.sal{background:var(--accent)}
.opt .txt{min-width:0;overflow-wrap:anywhere;font-size:15px}
.opt .txt b{display:block;font-size:13px;letter-spacing:.02em;color:var(--muted);font-weight:600;margin-bottom:1px}
.opt .tick{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;color:transparent}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .tick{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.prot{display:flex;gap:8px;flex-wrap:wrap;padding-left:2px}
.prot .chip{padding:6px 14px;min-height:36px}
.prot .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.skip{align-self:flex-start;font-size:13px;color:var(--muted)}
.bar{position:fixed;inset-inline:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.barin{max-width:560px;margin-inline:auto;display:flex;align-items:center;gap:8px}
.count{flex:1;min-width:max-content;white-space:nowrap;font-size:14px;color:var(--muted)}
.count b{display:block;color:var(--ink);font-size:16px}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 14px;min-height:48px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;text-align:center}
.btn.main{background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--bg);color:var(--ink);border:1.5px solid var(--line)}
.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
summary{cursor:pointer;font-weight:600}
details .in{display:flex;flex-direction:column;gap:10px;margin-top:10px}
textarea{width:100%;min-height:150px;font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px;resize:vertical}
.msg{white-space:pre-wrap;font-size:14px;overflow-wrap:anywhere;background:var(--bg);border-radius:10px;padding:10px;margin:0;font-family:var(--f-body)}
.hint{color:var(--muted);font-size:13px;margin:0}
.ok{color:var(--accent);font-weight:600;margin:0}
.err{color:var(--warn);font-weight:600;margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){.opt,.chip{transition:border-color .15s,background .15s}}

.inp{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:12px;min-height:48px}
label.day{cursor:text}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;min-height:36px}
.chk input{width:20px;height:20px;accent-color:var(--accent)}

.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.tbl{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:8px 10px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line)}
.tbl thead th{background:var(--bg);font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.tbl tbody th{text-align:left;font-weight:600;position:sticky;left:0;background:var(--surface)}
.tbl tfoot th,.tbl tfoot td{font-weight:700;border-bottom:0;background:var(--bg)}
.tbl tfoot th{text-align:left;position:sticky;left:0}
.nil{color:var(--muted)}
</style>

<script id="app-js">function parseMenu(raw){
  var DAYS=['Lunes','Martes','Miércoles','Jueves','Viernes'];
  function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');}
  var lines=String(raw||'').replace(/\r/g,'').split('\n').map(function(l){return l.replace(/[\uFE0F\u200B*~]/g,'').replace(/^_+|_+$/g,'').trim();});
  var title='',phone='',cur=null,days=[],masterSalad='';
  var hdr=/^(lunes|martes|miercoles|jueves|viernes)\s*:?$/;
  lines.forEach(function(l){
    if(!l)return;
    var n=norm(l);
    if(/menu de/.test(n)&&!title){title=l.replace(/[^\p{L}\p{N}°\/ ]/gu,'').replace(/^\s*men[uú] de\s*/i,'').trim();return;}
    if(/^☎/.test(l)){phone=(l.match(/\d[\d ]{6,}/)||[''])[0].trim();return;}
    if(hdr.test(n)){
      var idx=['lunes','martes','miercoles','jueves','viernes'].indexOf(n.replace(/[\s:]/g,''));
      cur={day:DAYS[idx],opts:[],salad:'',note:''};days.push(cur);return;
    }
    if(!cur)return;
    var m=l.match(/^(🔹|🔸|🥗)\s*(.*)$/u);
    if(!m){if(l.length<70){var nt=l.replace(/[^\p{L}\p{N} ,.\/-]/gu,'').trim();if(nt)cur.note=(cur.note?cur.note+' ':'')+nt;}return;}
    if(m[1]==='🥗'){
      var t=m[2].replace(/^ensalada de la semana\s*:?\s*/i,'').trim();
      if(t.length>15&&!masterSalad)masterSalad=t;
      cur.salad='1';
    }else cur.opts.push({icon:m[1],text:m[2].trim()});
  });
  days.forEach(function(d){if(d.salad&&!masterSalad)masterSalad='';});
  var out=days.map(function(d){var o={day:d.day,opts:d.opts,salad:!!d.salad};if(d.note&&!d.opts.length&&!d.salad)o.note=d.note;return o;});
  return {title:title,phone:phone,salad:masterSalad,days:out};
}


(function(){
  var $=function(s){return document.querySelector(s);};
  var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
  var LS={get:function(k){try{return localStorage.getItem(k);}catch(e){return null;}},set:function(k,v){try{localStorage.setItem(k,v);}catch(e){}}};
  var embedded=JSON.parse($('#menu-data').textContent);
  var API=(window.RYC_API||'').trim();
  var ADMIN=/[?&]cargar\b/.test(location.search);
  var PROT={pollo:'con pollo',atun:'con atún',huevo:'con huevo'};
  var PLABEL={pollo:'Pollo',atun:'Atún',huevo:'Huevo'};
  var dayIdx=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'][new Date().getDay()];
  var MENU=embedded,key='',sel={},pos=-1,draft=null,link='',status='',sample=!!API||true;
  var loading=!!API,name=LS.get('ryc-name')||'',sending=false,sentSig=null;
  var clave=LS.get('ryc-clave')||'',cur=null,orders=null,showNames=true,adminMsg='',adminErr='';

  /* ---------- API ---------- */
  function apiGet(p){return fetch(API+'?'+new URLSearchParams(p)).then(function(r){return r.json();});}
  function apiPost(b){return fetch(API,{method:'POST',body:JSON.stringify(b)}).then(function(r){return r.json();});}

  /* ---------- link mode (sin servidor) ---------- */
  function b64e(u8){var s='';for(var i=0;i<u8.length;i++)s+=String.fromCharCode(u8[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
  function b64d(t){t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';var s=atob(t),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
  function pipe(u8,S){var st=new S('deflate-raw');var w=st.writable.getWriter();w.write(u8);w.close();return new Response(st.readable).arrayBuffer().then(function(b){return new Uint8Array(b);});}
  function encodeMenu(m){var u8=new TextEncoder().encode(JSON.stringify({t:m.title,s:m.salad,p:m.phone,d:m.days}));if(typeof CompressionStream==='undefined')return Promise.resolve('r'+b64e(u8));return pipe(u8,CompressionStream).then(function(c){return 'z'+b64e(c);});}
  function decodeMenu(tok){var u8=b64d(tok.slice(1));var get=tok.charAt(0)==='z'?pipe(u8,DecompressionStream):Promise.resolve(u8);return get.then(function(b){var o=JSON.parse(new TextDecoder().decode(b));return {title:o.t,salad:o.s,phone:o.p,days:o.d};});}

  function setMenu(m){MENU=m;key='ryc-sel:'+m.title;sel={};try{sel=JSON.parse(LS.get(key)||'{}')||{};}catch(e){sel={};}sentSig=LS.get('ryc-sent:'+m.title);pos=m.days.map(function(d){return d.day;}).indexOf(dayIdx);}
  function save(){LS.set(key,JSON.stringify(sel));}
  function lineFor(d){var s=sel[d.day];if(!s)return '';if(s.k==='salad')return '🥗 Ensalada de la semana '+PROT[s.p||'pollo'];var o=d.opts[s.k];return o?o.icon+' '+o.text:'';}
  function message(){return MENU.days.filter(function(d){return lineFor(d);}).map(function(d){return d.day+'\n'+lineFor(d);}).join('\n\n');}
  function count(){return MENU.days.filter(function(d){return lineFor(d);}).length;}
  function sig(){return name.trim()+'|'+JSON.stringify(MENU.days.map(function(d){return lineFor(d);}));}

  /* ---------- resumen para María ---------- */
  function summary(){
    var by={};

    return by;
  }
  function people(){var s={};(orders||[]).forEach(function(o){s[String(o.name).toLowerCase()]=1;});return Object.keys(s).length;}
  var daySel=null;
  function kitchenText(withNames,only){
    var by=summary(),out=[];
    (cur?cur.days:[]).forEach(function(d){
      if(only&&only!=='all'&&d.day!==only)return;
      var g=by[d.day];if(!g)return;
      var total=0;
      var lines=Object.keys(g).sort(function(x,y){return g[y].length-g[x].length;}).map(function(l){
        total+=g[l].length;
        var nm=g[l].slice().sort(function(p,q){return p.localeCompare(q,'es');});
        return g[l].length+' × '+l+(withNames?'\n     '+nm.join(' · '):'');
      });
      out.push('*'+d.day+'*\n'+lines.join('\n')+'\nTotal: '+total+(total===1?' almuerzo':' almuerzos'));
    });
    return out.join('\n\n');
  }

  var view='tabla',ABR={Lunes:'Lun',Martes:'Mar','Miércoles':'Mié',Jueves:'Jue',Viernes:'Vie'};
  function cellOf(line){
    var ic=line.slice(0,2);
    if(ic==='🥗'){var m=/con ([^\s]+)/.exec(line);return '🥗'+(m?' '+m[1]:'');}
    return ic;
  }
  function matrix(){
    var days=(cur?cur.days:[]).map(function(d){return d.day;}),names={},order=[];
    (orders||[]).forEach(function(o){
      var k=String(o.name).toLowerCase();
      if(!names[k]){names[k]={name:o.name,c:{}};order.push(k);}
      names[k].c[o.day]=cellOf(o.line);
    });
    order.sort(function(p,q){return names[p].name.localeCompare(names[q].name,'es');});
    var rows=order.map(function(k){return names[k];});
    var tot={};
    days.forEach(function(d){
      var t={};rows.forEach(function(r){var c=r.c[d];if(c){var key=c.slice(0,2);t[key]=(t[key]||0)+1;}});
      tot[d]=['🔹','🔸','🥗'].filter(function(i){return t[i];}).map(function(i){return i+t[i];}).join(' ');
    });
    return {days:days,rows:rows,tot:tot};
  }
  function wcell(s){var w=0;for(var ch of s){w+=ch.codePointAt(0)>0x2000?2:1;}return w;}
  function pad(s,n){var w=wcell(s);return s+new Array(Math.max(0,n-w)+1).join(' ');}
  function matrixText(){
    var m=matrix(),head=['Nombre'].concat(m.days.map(function(d){return ABR[d]||d;}));
    var body=m.rows.map(function(r){return [r.name].concat(m.days.map(function(d){return r.c[d]||'-';}));});
    var foot=['Total'].concat(m.days.map(function(d){return m.tot[d]||'-';}));
    var all=[head].concat(body,[foot]),wd=head.map(function(_,i){return Math.max.apply(null,all.map(function(r){return wcell(r[i]);}));});
    var line=function(r){return r.map(function(c,i){return pad(c,wd[i]);}).join(' | ').replace(/\s+$/,'');};
    var sep=wd.map(function(w){return new Array(w+1).join('-');}).join('-|-');
    return '```\n'+line(head)+'\n'+sep+'\n'+body.map(line).join('\n')+'\n'+sep+'\n'+line(foot)+'\n```\n🔹 🔸 = opción del menú de ese día · 🥗 = ensalada';
  }

  /* ---------- María ---------- */

            h+='<details><summary>Ver texto para copiar</summary><div class="in"><pre class="msg" id="kitchen">'+esc(matrixText())+'</pre></div></details><div class="row"><button class="btn main" data-a="copykitchen">Copiar para la cocina</button><a class="btn sec" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent('Pedido · Diego T. Cocina\n'+matrixText())+'">Mandar por WhatsApp</a></div>';
          }else{
          var ds=daySel||'all',by2=summary();
          h+='<div class="prot" role="group" aria-label="Día"><button class="chip" data-a="dayf" data-d="all" aria-pressed="'+(ds==='all')+'">Toda la semana</button>';
          cur.days.forEach(function(d){if(by2[d.day])h+='<button class="chip" data-a="dayf" data-d="'+d.day+'" aria-pressed="'+(ds===d.day)+'">'+d.day+'</button>';});
          h+='</div><label class="chk"><input type="checkbox" id="names"'+(showNames?' checked':'')+'> Con nombres</label>';
          var kt=kitchenText(showNames,ds),head=(ds==='all'?'Pedido de la semana':'Pedido del '+ds)+' · Diego T. Cocina\n\n';
          h+='<pre class="msg" id="kitchen">'+esc(kt)+'</pre><div class="row"><button class="btn main" data-a="copykitchen">Copiar para la cocina</button><a class="btn sec" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(head+kt)+'">Mandar por WhatsApp</a></div>';
          }
        }
      }
      h+='</section>';
    }
    h+='</div>';
    var pv=$('#paste')?$('#paste').value:null;
    $('#app').innerHTML=h;
    if(pv!==null)$('#paste').value=pv;
  }
  function loadOrders(silent){
    if(!API||!cur||!clave)return;
    if(!silent){orders=null;render();}
    apiGet({action:'orders',week:cur.title,clave:clave}).then(function(r){
      if(r.ok){orders=r.orders;adminErr='';if(!daySel){daySel=summary()[dayIdx]?dayIdx:'all';}}else{orders=null;adminErr=r.error==='clave'?'La clave no es correcta.':'No se pudieron leer los pedidos.';}
      render();
    }).catch(function(){orders=null;adminErr='No se pudo conectar con el servidor de pedidos.';render();});
  }
  function loadAdmin(){
    if(!API)return;
    apiGet({action:'menu'}).then(function(r){cur=r.menu||null;render();loadOrders();}).catch(function(){adminErr='No se pudo conectar con el servidor de pedidos.';render();});
  }

  /* ---------- empleados ---------- */
  function render(){
    if(ADMIN)return renderAdmin();
    var h='<div class="wrap"><header><span class="kicker">Almuerzo RyC · Diego T. Cocina</span><h1>Elegí tu menú</h1><span class="week">Menú de '+esc(MENU.title)+'</span></header>';
    if(loading){$('#app').innerHTML=h+'<p class="hint">Cargando el menú…</p></div>';return;}
    if(sample)h+='<p class="hint">Menú de ejemplo. Todavía no se cargó el menú de esta semana.</p>';
    if(API)h+='<label class="day"><span class="dayname">Tu nombre</span><input id="nm" class="inp" autocomplete="name" placeholder="Nombre y apellido" value="'+esc(name)+'"></label>';
    h+='<div class="tools"><button class="chip" data-a="allsalad">Ensalada toda la semana</button><button class="link" data-a="clear">Borrar todo</button></div>';
    MENU.days.forEach(function(d,i){
      var cls='day'+(i===pos?' today':'')+(pos>=0&&i<pos?' past':'');
      h+='<section class="'+cls+'"><div class="dayhead"><h2 class="dayname">'+d.day+'</h2>'+(i===pos?'<span class="tag">Hoy</span>':(pos>=0&&i<pos?'<span class="tag mut">Ya pasó</span>':''))+'</div>';
      if(d.note)h+='<p class="note">'+esc(d.note)+'</p>';
      var s=sel[d.day];
      d.opts.forEach(function(o,k){var on=s&&s.k===k;h+='<button class="opt" data-a="pick" data-d="'+d.day+'" data-k="'+k+'" aria-pressed="'+!!on+'"><span class="dot '+(o.icon==='🔹'?'o1':'o2')+'"></span><span class="txt">'+esc(o.text)+'</span><span class="tick">✓</span></button>';});
      if(d.salad){
        var on2=s&&s.k==='salad';
        h+='<button class="opt" data-a="pick" data-d="'+d.day+'" data-k="salad" aria-pressed="'+!!on2+'"><span class="dot sal"></span><span class="txt"><b>Ensalada de la semana</b>'+esc(MENU.salad||'')+'</span><span class="tick">✓</span></button>';
        if(on2){h+='<div class="prot" role="group" aria-label="Proteína">';Object.keys(PLABEL).forEach(function(p){h+='<button class="chip" data-a="prot" data-d="'+d.day+'" data-p="'+p+'" aria-pressed="'+((s.p||'pollo')===p)+'">'+PLABEL[p]+'</button>';});h+='</div>';}
      }
      if(s)h+='<button class="link skip" data-a="none" data-d="'+d.day+'">No pido este día</button>';
      h+='</section>';
    });
    var n=count(),msg=message();
    if(status)h+='<p class="'+(/^No /.test(status)?'err':'ok')+'">'+esc(status)+'</p>';
    if(!API)h+='<details><summary>Ver mensaje</summary><div class="in"><pre class="msg" id="msgtxt">'+(msg?esc(msg):'Todavía no elegiste nada.')+'</pre></div></details>';
    h+='</div><div class="bar"><div class="barin"><div class="count"><b>'+(n?n+(n===1?' día':' días'):'Sin pedido')+'</b>'+(n?'elegidos':'Tocá un plato')+'</div>';
    if(API){
      var done=sentSig&&sentSig===sig();
      h+='<button class="btn main" data-a="send"'+((!n||sending||done||sample)?' aria-disabled="true"':'')+'>'+(sending?'Enviando…':(done?'Pedido enviado ✓':'Enviar pedido'))+'</button>';
    }else{
      h+='<button class="btn sec" data-a="copy"'+(n?'':' aria-disabled="true"')+'>Copiar</button><a class="btn main" target="_blank" rel="noopener" '+(n?'href="https://wa.me/?text='+encodeURIComponent(msg)+'"':'aria-disabled="true"')+'>Enviar a WhatsApp</a>';
    }
    h+='</div></div>';
    $('#app').innerHTML=h;
  }
  function flash(t){status=t;render();}
  function copy(text,okMsg,sourceSel){
    var fb=function(){var el=$(sourceSel);if(el){var r=document.createRange();r.selectNodeContents(el);var s=window.getSelection();s.removeAllRanges();s.addRange(r);if(el.select)el.select();}var m='No se pudo copiar solo. Tocá el texto y copialo.';if(ADMIN){adminMsg='';adminErr=m;}else status=m;render();};
    var ok=function(){if(ADMIN){adminErr='';adminMsg=okMsg;render();}else flash(okMsg);};
    try{navigator.clipboard.writeText(text).then(ok,fb);}catch(e){fb();}
  }
  function sendOrder(){
    name=name.trim();
    if(!name){flash('No pusiste tu nombre. Escribilo arriba para poder enviar.');return;}
    var items=MENU.days.map(function(d){return {day:d.day,line:lineFor(d)};}).filter(function(i){return i.line;});
    if(!items.length)return;
    sending=true;status='';render();
    var mine=sig();
    apiPost({action:'order',week:MENU.title,name:name,items:items}).then(function(r){
      sending=false;
      if(r&&r.ok){LS.set('ryc-name',name);sentSig=mine;LS.set('ryc-sent:'+MENU.title,mine);status='Listo, tu pedido llegó. Si cambiás algo, volvé a enviarlo.';}
      else status='No se pudo enviar el pedido. Probá de nuevo.';
      render();
    }).catch(function(){sending=false;status='No se pudo enviar el pedido. Revisá tu conexión y probá de nuevo.';render();});
  }
  document.addEventListener('input',function(e){
    if(e.target.id==='nm'){name=e.target.value;}
    if(e.target.id==='clave'){clave=e.target.value.trim();LS.set('ryc-clave',clave);}
  });
  document.addEventListener('change',function(e){
    if(e.target.id==='names'){showNames=e.target.checked;render();}
    if(e.target.id==='clave'){loadOrders(true);}
  });
  document.addEventListener('click',function(e){
    var b=e.target.closest('[data-a]');if(!b||b.getAttribute('aria-disabled')==='true')return;
    var a=b.dataset.a,d=b.dataset.d;
    if(a==='pick'){var k=b.dataset.k==='salad'?'salad':+b.dataset.k;if(sel[d]&&sel[d].k===k)delete sel[d];else sel[d]={k:k,p:(sel[d]&&sel[d].p)||'pollo'};save();status='';render();}
    else if(a==='prot'){sel[d]={k:'salad',p:b.dataset.p};save();status='';render();}
    else if(a==='none'){delete sel[d];save();status='';render();}
    else if(a==='clear'){sel={};save();status='';render();}
    else if(a==='allsalad'){var p=null;MENU.days.forEach(function(x){if(x.salad){p=(sel[x.day]&&sel[x.day].p)||p||'pollo';sel[x.day]={k:'salad',p:p};}});save();status='';render();}
    else if(a==='send'){sendOrder();}
    else if(a==='copy'){var msg=message();if(msg)copy(msg,'Mensaje copiado. Pegalo en el grupo.','#msgtxt');}
    else if(a==='copylink'){copy(link,'Link copiado. Pegalo en el grupo.','#linktxt');}
    else if(a==='dayf'){daySel=d;adminMsg='';render();}
    else if(a==='view'){view=d;adminMsg='';render();}
    else if(a==='copykitchen'){copy(view==='tabla'?'Pedido · Diego T. Cocina\n'+matrixText():(daySel==='all'||!daySel?'Pedido de la semana':'Pedido del '+daySel)+' · Diego T. Cocina\n\n'+kitchenText(showNames,daySel||'all'),'Copiado. Pegalo donde le mandás el pedido a la cocina.','#kitchen');}
    else if(a==='refresh'){adminMsg='';loadAdmin();}
    else if(a==='read'){
      var raw=$('#paste').value,m=parseMenu(raw);link='';adminMsg='';adminErr='';
      if(m.days.some(function(x){return x.opts.length||x.salad;})){
        draft={raw:raw,menu:m};render();
        if(!API)encodeMenu(m).then(function(tok){link=location.origin+location.pathname+'#m='+tok;render();});
      }else{draft={raw:raw,err:'No encontré días con platos. Pegá el mensaje completo, con Lunes, Martes, etc.'};render();}
    }else if(a==='publish'){
      if(!clave){adminErr='Ingresá la clave de administración arriba.';render();return;}
      adminMsg='Publicando…';adminErr='';render();
      apiPost({action:'menu',clave:clave,menu:draft.menu}).then(function(r){
        if(r&&r.ok){adminMsg='Menú publicado. Ya lo ven todos en el link de siempre.';cur=draft.menu;orders=[];draft=null;render();loadOrders();}
        else{adminMsg='';adminErr=r&&r.error==='clave'?'La clave no es correcta.':'No se pudo publicar el menú.';render();}
      }).catch(function(){adminMsg='';adminErr='No se pudo conectar con el servidor de pedidos.';render();});
    }
  });
  function load(){
    if(ADMIN){setMenu(embedded);render();loadAdmin();return;}
    var m=/#m=([zr][A-Za-z0-9_-]+)/.exec(location.hash);
    if(m){decodeMenu(m[1]).then(function(mm){if(mm&&mm.days){sample=false;setMenu(mm);}loading=false;render();}).catch(function(){setMenu(embedded);loading=false;status='No se pudo leer el link del menú. Pedile el link de nuevo a quien lo carga.';render();});return;}
    if(API){
      apiGet({action:'menu'}).then(function(r){if(r&&r.menu&&r.menu.days){sample=false;setMenu(r.menu);}else setMenu(embedded);loading=false;render();})
      .catch(function(){setMenu(embedded);loading=false;status='No se pudo cargar el menú. Revisá tu conexión y recargá.';render();});
      return;
    }
    setMenu(embedded);loading=false;render();
  }
  window.addEventListener('hashchange',function(){location.reload();});
  setMenu(embedded);render();load();
})();
</script>
